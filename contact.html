<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - H&H Business Insights</title>

    <meta name="description" content="Get in touch with H&H Business Insights to book a service or ask a question.">
    <link rel="canonical" href="https://hnhbi.com/contact.html">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/design-tokens.css">
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- Preload Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Sora:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">

    <header class="site-header" id="main-header">
        <!-- Header will be injected by JS -->
    </header>

    <main>
        <section class="page-header">
            <div class="container">
                <h1>Contact Us</h1>
                <p>We'd love to hear from you. Reach out to discuss your project or book a service.</p>
            </div>
        </section>

        <section id="contact" class="contact-section">
            <div class="container">
              <div class="form-wrapper">
                  <h2 class="section-title">Get in Touch</h2>
                  <form id="contact-form" class="contact-form" action="YOUR_SERVERLESS_ENDPOINT" method="POST">
                      <div class="form-row">
                          <label for="contact-name">Your Name</label>
                          <input type="text" id="contact-name" name="name" required placeholder="John Doe">
                      </div>
                      <div class="form-row">
                          <label for="contact-email">Your Email</label>
                          <input type="email" id="contact-email" name="email" required placeholder="you@example.com">
                      </div>
                      <div class="form-row">
                          <label for="contact-service">Service of Interest</label>
                          <select id="contact-service" name="service" required>
                              <option value="" disabled selected>Select a service…</option>
                              <!-- Options populated by JS -->
                          </select>
                      </div>
                      <div class="form-row">
                          <label for="contact-message">Message</label>
                          <textarea id="contact-message" name="message" rows="4" placeholder="How can we help you?"></textarea>
                      </div>
                      <button type="submit" class="btn btn-primary">Send Request</button>
                  </form>
              </div>
            </div>
          </section>
    </main>

    <footer class="site-footer" id="main-footer">
        <!-- Footer will be injected by JS -->
    </footer>

    <script src="assets/js/modules/layout.js"></script>
    <script src="assets/js/contact.js"></script>
</body>
</html>
